<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23e5182b'/><text y='.9em' font-size='70' x='50%' text-anchor='middle' font-family='Arial' font-weight='bold' fill='white'>T</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torii · Portal</title>
    <script>
      // Setea data-theme antes del primer paint para evitar el flash del
      // tema equivocado — mismo mecanismo que leerá ThemeContext después.
      try {
        var t = localStorage.getItem('torii-theme')
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
